pre-commit:
    parallel: true
    commands:
        lint:
            glob: "*.{js,mjs,cjs,ts,tsx}"
            run: npx eslint {staged_files}
        format-cpp:
            glob: "*.{cc,cpp,cxx,h,hpp}"
            run: clang-format -i {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}
